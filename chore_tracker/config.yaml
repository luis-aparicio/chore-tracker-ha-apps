# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Chore Tracker
# Image tag to run. Supervisor only offers an Update when this changes, so it pins a
# commit tag (sha-xxxxxxx) or release (1.2.3), never the moving edge tag. The chore-tracker
# repo's "Publish image" workflow rewrites this line after each build (bump-ha-app job);
# edit by hand only if that automation is off.
version: "sha-fe02bf3"
slug: chore_tracker
description: Household chore tracker with ingress panel and persistent /data storage.
url: https://github.com/luis-aparicio/chore-tracker-ha-apps/tree/main/chore_tracker
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8080
# Optional host port for standalone browser access on the LAN (no HA login).
# Disable under Configuration → Network to use ingress only.
ports:
  8080/tcp: 8124
ports_description:
  8080/tcp: Standalone web UI on the local network (Chore Tracker login / invites)
panel_icon: mdi:checkbox-marked-outline
panel_title: Chore Tracker
panel_admin: false
hassio_api: true
discovery:
  - chore_tracker
map:
  - type: data
    read_only: false
environment:
  CHORE_TRACKER_CONFIG: /data/options.json
  # LAN host port and HA ingress are HTTP; Secure cookies would not stick in the browser.
  # Set true (or toggle the option) if you terminate TLS in front of the app.
  CHORE_TRACKER_COOKIE_SECURE: 'false'
options:
  logLevel: info
  cookieSecure: false
schema:
  logLevel: list(debug|info|warn|error)
  cookieSecure: bool
image: ghcr.io/luis-aparicio/chore-tracker
